# Portrait Value Studio: nginx configuration for a launch. Include this file from the http {} block
# (for example from /etc/nginx/conf.d/), then set server_name, root and the certificate paths.
# Netlify / Cloudflare Pages read _headers instead; Apache users: see .htaccess.

# Cache lifetimes by path. HTML, CSS and JS are revalidated on every load (an unchanged file costs a
# 304), because their names carry no version. Fonts never change in place, so a year is safe.
map $uri $pvs_cache_control {
    default                 "no-cache";
    ~^/fonts/               "public, max-age=31536000, immutable";
    ~^/img/                 "public, max-age=604800";
    ~^/favicon\.(svg|ico)$  "public, max-age=604800";
    ~^/apple-touch-icon\.png$ "public, max-age=604800";
}
# Fonts are fetched with CORS: this lets a sandboxed embed (whose origin is opaque) load them.
# nginx leaves out a header whose value is empty, so other paths get none.
map $uri $pvs_font_cors {
    default   "";
    ~^/fonts/ "*";
}

server {
    listen 80;
    listen [::]:80;
    server_name example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name example.com;

    # Publish only the runtime files: index.html, 404.html, favicon.svg, robots.txt, styles.css,
    # js/, img/ and fonts/. Never point root at a git checkout.
    root /var/www/portrait-value-studio;
    index index.html;

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

    server_tokens off;
    autoindex off;
    charset utf-8;

    # a missing page, and a folder with no index, both show the app's own 404 page
    error_page 404 /404.html;
    error_page 403 =404 /404.html;
    location = /404.html { internal; }

    # never serve dotfiles (.git above all), except the ACME folder certificates need
    location ~ /\.(?!well-known/) { return 404; }
    # the repository's own notes and configs are not part of the site
    location ~ ^/(README\.md|_headers|\.htaccess|deploy(/.*)?|fonts/README\.md)$ { return 404; }

    location / {
        try_files $uri $uri/ =404;
    }

    # frame-ancestors is left out on purpose: the app is meant to be embeddable in other sites'
    # iframes. Do not add X-Frame-Options. To limit embedding to known sites, append
    # "; frame-ancestors 'self' https://example.com" to the policy.
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' blob:; connect-src 'none'; base-uri 'none'; form-action 'none'; object-src 'none'; require-trusted-types-for 'script'; trusted-types 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "accelerometer=(), autoplay=(self), browsing-topics=(), camera=(), display-capture=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), usb=(), clipboard-write=(self)" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Cache-Control $pvs_cache_control always;
    add_header Access-Control-Allow-Origin $pvs_font_cors always;
}
